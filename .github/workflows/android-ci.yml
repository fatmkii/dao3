name: Android CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and build
        run: |
          ./android/gradlew -p android \
            testDebugUnitTest testReleaseUnitTest \
            lintDebug lintRelease \
            assembleDebug assembleRelease assembleDebugAndroidTest \
            --no-daemon

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-verify-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

  instrumented-tests:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./android/gradlew -p android connectedDebugAndroidTest --no-daemon

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
