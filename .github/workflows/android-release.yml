name: Android Release

on:
  push:
    tags:
      - "android-v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ^android-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must match android-vX.Y.Z" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be at most 999" >&2
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range" >&2
            exit 1
          fi

          version_name="${tag#android-v}"
          apk_name="cpttmm-${version_name}.apk"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./android/gradlew -p android testDebugUnitTest testReleaseUnitTest lintRelease assembleRelease --no-daemon \
            -PVERSION_NAME='${{ steps.version.outputs.name }}' \
            -PVERSION_CODE='${{ steps.version.outputs.code }}'

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name='${{ github.ref_name }}' \
            --jq .body > release-notes.md

      - name: Prepare release files
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | cut -d' ' -f1 > dist/apk.sha256
          sha256="$(cat dist/apk.sha256)"
          jq -n \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --rawfile notes release-notes.md \
            --arg apk_url "https://cpttmm.oss-cn-shenzhen.aliyuncs.com/android/$APK_NAME" \
            --arg github_url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --arg sha256 "$sha256" \
            '{version_name: $version_name, version_code: $version_code, notes: $notes, apk_url: $apk_url, github_url: $github_url, sha256: $sha256}' \
            > dist/version.json

      - name: Install ossutil
        env:
          OSSUTIL_VERSION: "2.3.0"
          OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
        run: |
          archive="$RUNNER_TEMP/ossutil.zip"
          install_dir="$RUNNER_TEMP/ossutil"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://gosspublic.alicdn.com/ossutil/v2/$OSSUTIL_VERSION/ossutil-$OSSUTIL_VERSION-linux-amd64.zip"
          printf '%s  %s\n' "$OSSUTIL_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$install_dir"
          binary_dir="$install_dir/ossutil-$OSSUTIL_VERSION-linux-amd64"
          chmod 0755 "$binary_dir/ossutil"
          echo "$binary_dir" >> "$GITHUB_PATH"
          "$binary_dir/ossutil" version

      - name: Upload APK files to OSS
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-shenzhen
          OSS_ENDPOINT: https://oss-cn-shenzhen.aliyuncs.com
        run: |
          versioned_object="oss://cpttmm/android/$APK_NAME"
          latest_object="oss://cpttmm/android/cpttmm-latest.apk"
          versioned_url="https://cpttmm.oss-cn-shenzhen.aliyuncs.com/android/$APK_NAME"
          latest_url="https://cpttmm.oss-cn-shenzhen.aliyuncs.com/android/cpttmm-latest.apk"

          ossutil cp "dist/$APK_NAME" "$versioned_object" \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable" \
            --content-disposition "attachment; filename=\"$APK_NAME\"" \
            --content-type application/vnd.android.package-archive \
            --force
          ossutil cp "dist/$APK_NAME" "$latest_object" \
            --acl public-read \
            --cache-control no-cache \
            --content-disposition "attachment; filename=\"$APK_NAME\"" \
            --content-type application/vnd.android.package-archive \
            --force

          local_size="$(stat --format=%s "dist/$APK_NAME")"
          for url in "$versioned_url" "$latest_url"; do
            headers="$(mktemp)"
            curl --fail --silent --show-error --head --retry 3 \
              --dump-header "$headers" \
              --output /dev/null \
              "$url"
            remote_size="$(awk 'BEGIN { IGNORECASE = 1 } /^content-length:/ { gsub(/\r/, "", $2); value = $2 } END { print value }' "$headers")"
            if [[ "$remote_size" != "$local_size" ]]; then
              echo "Unexpected Content-Length for $url: expected $local_size, got $remote_size" >&2
              exit 1
            fi
          done

      - name: Upload release files to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: dist/version.json,dist/apk.sha256
          target: /tmp/cpttmm-android-release
          strip_components: 1

      - name: Publish official download files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            destination=/data/wwwroot/v3.cpttmm.com/shared/downloads/android
            mkdir -p "$destination"
            install -m 0644 /tmp/cpttmm-android-release/version.json "$destination/version.json"
            install -m 0644 /tmp/cpttmm-android-release/apk.sha256 "$destination/apk.sha256"
            rm -rf /tmp/cpttmm-android-release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/${{ steps.version.outputs.apk_name }}
            dist/version.json
            dist/apk.sha256
