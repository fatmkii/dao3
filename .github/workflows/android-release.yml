name: Android Release

on:
  push:
    tags:
      - "android-v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ^android-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must match android-vX.Y.Z" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must be at most 999" >&2
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range" >&2
            exit 1
          fi

          version_name="${tag#android-v}"
          apk_name="cpttmm-${version_name}.apk"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./android/gradlew -p android testDebugUnitTest testReleaseUnitTest lintRelease assembleRelease --no-daemon \
            -PVERSION_NAME='${{ steps.version.outputs.name }}' \
            -PVERSION_CODE='${{ steps.version.outputs.code }}'

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name='${{ github.ref_name }}' \
            --jq .body > release-notes.md

      - name: Prepare release files
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | cut -d' ' -f1 > dist/apk.sha256
          sha256="$(cat dist/apk.sha256)"
          jq -n \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --rawfile notes release-notes.md \
            --arg apk_url "https://cpttmm.vip/android/$APK_NAME" \
            --arg backup_apk_url "https://cpttmm.com/android/$APK_NAME" \
            --arg github_url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --arg sha256 "$sha256" \
            '{version_name: $version_name, version_code: $version_code, notes: $notes, apk_url: $apk_url, backup_apk_url: $backup_apk_url, github_url: $github_url, sha256: $sha256}' \
            > dist/version.json

      - name: Upload APK files to Cloudflare R2
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_SECRET }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET"
          test -n "$R2_ENDPOINT"
          aws --version

          versioned_key="android/$APK_NAME"
          latest_key="android/cpttmm-latest.apk"
          versioned_url="https://cpttmm.vip/$versioned_key"
          latest_url="https://cpttmm.vip/$latest_key"

          aws s3 cp "dist/$APK_NAME" "s3://$R2_BUCKET/$versioned_key" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-disposition "attachment; filename=\"$APK_NAME\"" \
            --content-type application/vnd.android.package-archive \
            --no-progress
          aws s3 cp "dist/$APK_NAME" "s3://$R2_BUCKET/$latest_key" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control no-cache \
            --content-disposition "attachment; filename=\"$APK_NAME\"" \
            --content-type application/vnd.android.package-archive \
            --no-progress

          local_size="$(stat --format=%s "dist/$APK_NAME")"
          for key in "$versioned_key" "$latest_key"; do
            remote_size="$(aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "$key" \
              --endpoint-url "$R2_ENDPOINT" \
              --query ContentLength \
              --output text)"
            if [[ "$remote_size" != "$local_size" ]]; then
              echo "Unexpected R2 object size for $key: expected $local_size, got $remote_size" >&2
              exit 1
            fi
          done

          curl --fail --silent --show-error --head --retry 3 --output /dev/null "$versioned_url"
          curl --fail --silent --show-error --head --retry 3 --output /dev/null "$latest_url"

      - name: Upload release files to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: dist/*
          target: /tmp/cpttmm-android-release
          strip_components: 1

      - name: Publish official download files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.PROD_PORT }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            app_dir=/data/wwwroot/v3.cpttmm.com
            apk_destination="$app_dir/shared/android"
            metadata_destination="$app_dir/shared/downloads/android"
            public_android="$app_dir/current/public/android"

            mkdir -p "$apk_destination" "$metadata_destination"
            if [ -e "$public_android" ] && [ ! -L "$public_android" ]; then
              echo "$public_android exists and is not a symlink" >&2
              exit 1
            fi
            rm -f "$public_android"
            ln -sfn "$apk_destination" "$public_android"

            install -m 0644 "/tmp/cpttmm-android-release/${{ steps.version.outputs.apk_name }}" "$apk_destination/${{ steps.version.outputs.apk_name }}"
            install -m 0644 "/tmp/cpttmm-android-release/${{ steps.version.outputs.apk_name }}" "$apk_destination/cpttmm-latest.apk"
            install -m 0644 /tmp/cpttmm-android-release/version.json "$metadata_destination/version.json"
            install -m 0644 /tmp/cpttmm-android-release/apk.sha256 "$metadata_destination/apk.sha256"
            rm -rf /tmp/cpttmm-android-release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/${{ steps.version.outputs.apk_name }}
            dist/version.json
            dist/apk.sha256
